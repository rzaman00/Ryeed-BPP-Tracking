# Serves BPP Predicts at https://yoursite.edu/predicts/
# The trailing slashes matter: they make nginx strip the /predicts/ prefix.
location = /predicts { return 301 /predicts/; }
location /predicts/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # an all-sites optimal search can take a while
}
